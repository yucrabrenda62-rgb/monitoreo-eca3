<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoreo de calidad de agua · ECA Categoría 3</title>
<style>
:root{--bg:#f6f8f7;--fg:#1c2623;--card:#fff;--bd:#d5ded9;--ac:#1d6b57;--bad:#b3261e;--ok:#1d6b57;--mut:#5d6b66}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--fg:#e4ece8;--card:#1b2420;--bd:#33423c;--ac:#4cb89a;--bad:#ff8a80;--ok:#4cb89a;--mut:#9bb0a8}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
header{background:var(--ac);color:#fff;padding:12px 20px}header h1{margin:0 0 8px;font-size:18px}
nav button{background:transparent;color:#fff;border:0;border-bottom:3px solid transparent;padding:6px 14px;font-size:15px;cursor:pointer}
nav button.on{border-color:#fff;font-weight:600}
main{max-width:1150px;margin:0 auto;padding:16px}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;margin:4px 4px 0 0}
button.b.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:4px 7px;text-align:center}th{background:var(--bg)}td.l,th.l{text-align:left}
.no{color:var(--bad);font-weight:700}.ok{color:var(--ok)}.mut{color:var(--mut)}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;margin:14px 0 6px}
#rep{background:#fff;color:#000;padding:28px;border:1px solid var(--bd)}#rep th{background:#eef2f0;color:#000}#rep td,#rep th{border-color:#999}#rep .no{color:#b3261e}#rep .ok{color:#1d6b57}
.sign{display:flex;gap:60px;margin-top:70px}.sign div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px;font-size:13px}
@media print{header,.noprint,section:not(#t3){display:none!important}main{padding:0;max-width:none}#rep{border:0;padding:0}body{background:#fff}}
</style>
</head>
<body>
<header class="noprint"><h1>💧 Monitoreo de calidad de agua · ECA Categoría 3 (D.S. 004-2017-MINAM)</h1>
<nav><button data-t="t1" class="on">1 · Muestras</button><button data-t="t2">2 · Estadística</button><button data-t="t3">3 · Informe</button></nav></header>
<main>
<section id="t1" class="on">
 <div class="card"><h2 id="ftitle">Nueva muestra</h2><div class="grid" id="form"></div>
  <button class="b" id="save">Guardar muestra</button><button class="b s" id="clear">Limpiar</button></div>
 <div class="card"><h2>Muestras registradas (<span id="cnt">0</span>)</h2><div class="tw" id="list"></div>
  <button class="b s" id="exJ">Exportar JSON</button><button class="b s" id="imJ">Importar JSON</button><input type="file" id="file" accept=".json" hidden>
  <button class="b s" id="exC">Exportar CSV</button><button class="b s" id="demo">Cargar ejemplo (datos ficticios)</button><button class="b s" id="wipe">Borrar todo</button></div>
</section>
<section id="t2">
 <div class="card"><h2>Configuración ECA y prueba</h2><div class="grid" id="cfg"></div>
  <p class="mut" style="font-size:12px">Límites editables. SST, SSV, turbidez y alcalinidad no tienen valor en la Categoría 3. Verifica los valores con el texto oficial.</p></div>
 <div id="stats"></div>
</section>
<section id="t3">
 <div class="card noprint"><h2>Datos del informe</h2><div class="grid" id="rcfg"></div>
  <label style="margin-top:10px">Marco legal (un ítem por línea)<textarea id="legal" rows="6"></textarea></label>
  <label style="margin-top:10px">Conclusiones (editable)<textarea id="concl" rows="7"></textarea></label>
  <button class="b s" id="gen">Autogenerar conclusiones</button><button class="b" id="prn">Imprimir / Guardar PDF</button><button class="b" id="doc">Descargar Word (.doc)</button></div>
 <div id="rep"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAR=[['sst','SST','mg/L'],['ssv','SSV','mg/L'],['dbo','DBO₅','mg/L'],['dqo','DQO','mg/L'],['turb','Turbidez','NTU'],['ph','pH','u. pH'],['temp','Temperatura','°C'],['alc','Alcalinidad','mg CaCO₃/L'],['ayg','Aceites y grasas','mg/L']];
const PN=Object.fromEntries(PAR.map(p=>[p[0],p[1]]));
const FLD=[['codigo','Código de muestra','text'],['grupo','Grupo / punto de muestreo','text'],['fecha','Día','date'],['hora','Hora','time'],['zona','Zona UTM (S)','sel'],['este','UTM Este (m)','number'],['norte','UTM Norte (m)','number'],...PAR.map(p=>[p[0],`${p[1]} (${p[2]})`,'number']),['tref','T° de referencia (°C, opcional)','number'],['reactivos','Reactivos (observación)','text']];
const DEF={samples:[],sub:'D1',alpha:.05,lim:{D1:{dbo:15,dqo:40,ayg:5,phmin:6.5,phmax:8.5,dT:3},D2:{dbo:15,dqo:40,ayg:10,phmin:6.5,phmax:8.4,dT:3}},
rep:{titulo:'Informe de monitoreo de calidad de agua',encargado:'',cargo:'',inst:'',cuerpo:'',lugar:'',fecha:new Date().toISOString().slice(0,10),legal:'Ley N.º 28611, Ley General del Ambiente\nLey N.º 29338, Ley de Recursos Hídricos\nD.S. N.º 004-2017-MINAM, Estándares de Calidad Ambiental (ECA) para Agua – Categoría 3\nR.J. N.º 010-2016-ANA, Protocolo Nacional para el Monitoreo de la Calidad de los Recursos Hídricos Superficiales',concl:''}};
let S;try{S=JSON.parse(localStorage.getItem('eca3'))||DEF}catch(e){S=DEF}
S=Object.assign({},DEF,S,{rep:Object.assign({},DEF.rep,S.rep||{})});
const save=()=>{try{localStorage.setItem('eca3',JSON.stringify(S))}catch(e){}};
let editId=null;
/* ---------- matemática ---------- */
const lg=x=>{const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.001208650973866179,-5.395239384953e-6];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x)};
const T=1e-30;
function bcf(a,b,x){const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<T)d=T;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<T)d=T;c=1+aa/c;if(Math.abs(c)<T)c=T;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<T)d=T;c=1+aa/c;if(Math.abs(c)<T)c=T;d=1/d;const dl=d*c;h*=dl;if(Math.abs(dl-1)<3e-10)break}return h}
const ib=(a,b,x)=>{if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b};
function gq(a,x){if(x<=0)return 1;if(x<a+1){let ap=a,s=1/a,del=s;for(let n=0;n<300;n++){ap++;del*=x/ap;s+=del;if(Math.abs(del)<Math.abs(s)*1e-10)break}return 1-s*Math.exp(-x+a*Math.log(x)-lg(a))}
let b=x+1-a,c=1e30,d=1/b,h=d;for(let i=1;i<300;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<T)d=T;c=b+an/c;if(Math.abs(c)<T)c=T;d=1/d;const dl=d*c;h*=dl;if(Math.abs(dl-1)<1e-10)break}return Math.exp(-x+a*Math.log(x)-lg(a))*h}
const pT2=(t,df)=>ib(df/2,.5,df/(df+t*t)),pF=(F,d1,d2)=>ib(d2/2,d1/2,d2/(d2+d1*F)),pChi=(x,k)=>gq(k/2,x/2);
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
const desc=a=>a.length?{n:a.length,m:mean(a),md:med(a),sd:sd(a),cv:sd(a)/mean(a)*100,mn:Math.min(...a),mx:Math.max(...a)}:null;
function ranks(a){const idx=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]),r=Array(a.length);let ties=0;for(let i=0;i<idx.length;){let j=i;while(j+1<idx.length&&idx[j+1][0]===idx[i][0])j++;const t=j-i+1;ties+=t**3-t;for(let k=i;k<=j;k++)r[idx[k][1]]=(i+j)/2+1;i=j+1}return{r,ties}}
function cmpGroups(gs){gs=gs.filter(g=>g.length>=2);const k=gs.length;if(k<2)return null;const all=gs.flat(),N=all.length;let o={k,N};
if(k===2){const[a,b]=gs,v1=sd(a)**2/a.length,v2=sd(b)**2/b.length,t=(mean(a)-mean(b))/Math.sqrt(v1+v2),df=(v1+v2)**2/(v1**2/(a.length-1)+v2**2/(b.length-1));o.test='t de Welch';o.st=t;o.df=df;o.p=isFinite(t)?pT2(t,df):NaN}
else{const gm=mean(all);const ssb=gs.reduce((s,g)=>s+g.length*(mean(g)-gm)**2,0),ssw=gs.reduce((s,g)=>s+g.reduce((x,y)=>x+(y-mean(g))**2,0),0);const F=(ssb/(k-1))/(ssw/(N-k));o.test='ANOVA 1 vía';o.st=F;o.df=`${k-1}, ${N-k}`;o.p=isFinite(F)?pF(F,k-1,N-k):NaN}
const{r,ties}=ranks(all);let pos=0,H=0;gs.forEach(g=>{const R=r.slice(pos,pos+g.length).reduce((x,y)=>x+y,0);H+=R*R/g.length;pos+=g.length});H=12/(N*(N+1))*H-3*(N+1);const C=1-ties/(N**3-N);o.H=C>0?H/C:NaN;o.pk=isFinite(o.H)?pChi(o.H,k-1):NaN;return o}
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:NaN};
const f=(x,d=2)=>isFinite(x)?(+x).toFixed(d):'—',fp=p=>isFinite(p)?(p<.001?'<0.001':p.toFixed(3)):'—';
const fd=s=>s?s.split('-').reverse().join('/'):'—';
/* ---------- ECA ---------- */
const L=()=>S.lim[S.sub];
function ev(s,k){const v=num(s[k]),l=L();if(!isFinite(v))return'na';if(k==='ph')return v>=l.phmin&&v<=l.phmax?'ok':'no';
if(k==='temp'){const t=num(s.tref);return isFinite(t)?(Math.abs(v-t)<=l.dT?'ok':'no'):'na'}
return['dbo','dqo','ayg'].includes(k)?(v<=l[k]?'ok':'no'):'na'}
const limT=k=>{const l=L();return k==='ph'?`${l.phmin}–${l.phmax}`:k==='temp'?`Δ${l.dT} °C`:['dbo','dqo','ayg'].includes(k)?`≤ ${l[k]}`:'sin ECA'};
const subN=()=>S.sub==='D1'?'D1 (Riego de vegetales)':'D2 (Bebida de animales)';
/* ---------- cómputo ---------- */
function compute(){const sm=S.samples,A=S.alpha,out={desc:{},grp:{},one:[],cmp:[],cor:[],groups:[]};
const gn=[...new Set(sm.map(s=>s.grupo||'(sin grupo)'))];out.groups=gn;
PAR.forEach(([k])=>{const a=sm.map(s=>num(s[k])).filter(isFinite);out.desc[k]=desc(a);out.grp[k]=gn.map(g=>desc(sm.filter(s=>(s.grupo||'(sin grupo)')===g).map(s=>num(s[k])).filter(isFinite)));
const gs=gn.map(g=>sm.filter(s=>(s.grupo||'(sin grupo)')===g).map(s=>num(s[k])).filter(isFinite));const c=cmpGroups(gs);if(c)out.cmp.push({k,...c});
if(['dbo','dqo','ayg'].includes(k)&&a.length>=2&&sd(a)>0){const t=(mean(a)-L()[k])/(sd(a)/Math.sqrt(a.length)),p2=pT2(t,a.length-1);out.one.push({k,n:a.length,m:mean(a),lim:L()[k],t,p:t>0?p2/2:1-p2/2})}});
for(let i=0;i<PAR.length;i++)for(let j=i+1;j<PAR.length;j++){const x=[],y=[];sm.forEach(s=>{const a=num(s[PAR[i][0]]),b=num(s[PAR[j][0]]);if(isFinite(a)&&isFinite(b)){x.push(a);y.push(b)}});if(x.length<3)continue;const mx=mean(x),my=mean(y);let sxy=0,sxx=0,syy=0;x.forEach((v,q)=>{sxy+=(v-mx)*(y[q]-my);sxx+=(v-mx)**2;syy+=(y[q]-my)**2});if(!sxx||!syy)continue;const r=sxy/Math.sqrt(sxx*syy);out.cor.push({a:PAR[i][0],b:PAR[j][0],n:x.length,r,p:Math.abs(r)>=1?0:pT2(r*Math.sqrt((x.length-2)/(1-r*r)),x.length-2)})}
return out}
/* ---------- render: tablas ---------- */
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map((x,i)=>`<th${i?'':' class="l"'}>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?'':' class="l"'}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const tDesc=c=>tbl(['Parámetro','n','Media','Mediana','DE','CV %','Mín.','Máx.'],PAR.filter(p=>c.desc[p[0]]).map(([k,n,u])=>{const d=c.desc[k];return[`${n} (${u})`,d.n,f(d.m),f(d.md),f(d.sd),f(d.cv,1),f(d.mn),f(d.mx)]}));
const tGrp=c=>c.groups.length<2?'<p class="mut">Asigna al menos 2 grupos/puntos para comparar.</p>':tbl(['Parámetro',...c.groups.map(g=>esc(g)+' (media ± DE, n)')],PAR.filter(p=>c.desc[p[0]]).map(([k,n])=>[n,...c.grp[k].map(d=>d?`${f(d.m)} ± ${f(d.sd)} (${d.n})`:'—')]));
const tOne=c=>c.one.length?tbl(['Parámetro','n','Media','Límite ECA','t','p (H₁: media > límite)','Decisión'],c.one.map(o=>[PN[o.k],o.n,f(o.m),o.lim,f(o.t),fp(o.p),o.p<S.alpha?`<span class="no">Excede (p&lt;${S.alpha})</span>`:'<span class="ok">Sin evidencia de exceso</span>'])):'<p class="mut">Se requieren n ≥ 2 y variación en DBO₅, DQO o grasas y aceites.</p>';
const tCmp=c=>c.cmp.length?tbl(['Parámetro','Prueba','Estadístico','gl','p','Kruskal-Wallis H','p (KW)','Decisión'],c.cmp.map(o=>[PN[o.k],o.test,f(o.st),typeof o.df==='number'?f(o.df,1):o.df,fp(o.p),f(o.H),fp(o.pk),(o.p<S.alpha||o.pk<S.alpha)?'<span class="no">Diferencia significativa</span>':'No significativa'])):'<p class="mut">Se requieren ≥ 2 grupos con n ≥ 2 cada uno.</p>';
const tCor=c=>c.cor.length?tbl(['Par de parámetros','n','r de Pearson','p','Lectura'],c.cor.map(o=>[`${PN[o.a]} – ${PN[o.b]}`,o.n,f(o.r),fp(o.p),o.p<S.alpha?`<b>${Math.abs(o.r)>=.7?'fuerte':'moderada'} ${o.r>0?'positiva':'negativa'}</b>`:'no significativa'])):'<p class="mut">Se requieren n ≥ 3 pares de datos.</p>';
const tRes=()=>{const hs=['Código','Grupo',...PAR.map(p=>`${p[1]}<br><small>${p[2]}</small>`)];const rows=[['<b>ECA '+S.sub+'</b>','',...PAR.map(p=>`<small>${limT(p[0])}</small>`)],...S.samples.map(s=>[esc(s.codigo),esc(s.grupo),...PAR.map(([k])=>{const e=ev(s,k);return`<span class="${e==='no'?'no':''}">${isFinite(num(s[k]))?s[k]:'—'}${e==='no'?' ✗':''}</span>`})])];return tbl(hs,rows)};
/* ---------- interpretación ---------- */
function interp(c){const out=[],sm=S.samples,A=S.alpha;
[['dbo','DBO₅','mg/L'],['dqo','DQO','mg/L'],['ayg','Aceites y grasas','mg/L'],['ph','pH','u. pH'],['temp','Temperatura','°C']].forEach(([k,n,u])=>{const d=c.desc[k];if(!d)return;const ev_=sm.map(s=>[s,ev(s,k)]).filter(x=>x[1]!=='na'),bad=ev_.filter(x=>x[1]==='no');
let t=`<b>${n}:</b> media ${f(d.m)} ${u} (rango ${f(d.mn)}–${f(d.mx)}; CV ${f(d.cv,1)} %). `;
if(!ev_.length)t+=k==='temp'?'No se ingresó temperatura de referencia, por lo que no se evaluó el criterio Δ3 °C. ':'';
else t+=`${ev_.length-bad.length} de ${ev_.length} muestras cumplen el ECA ${subN()} (${limT(k)})`+(bad.length?`; incumplen: ${bad.map(x=>esc(x[0].codigo)).join(', ')}. `:'. ');
const o=c.one.find(z=>z.k===k);if(o)t+=o.p<A?`La media excede significativamente el límite (t = ${f(o.t)}; p = ${fp(o.p)}). `:`No hay evidencia estadística de que la media supere el límite (p = ${fp(o.p)}). `;
out.push(t)});
const na=['sst','ssv','turb','alc'].filter(k=>c.desc[k]).map(k=>{const d=c.desc[k];return`${PN[k]} (media ${f(d.m)})`});
if(na.length)out.push(`<b>Parámetros sin valor ECA en la Categoría 3:</b> ${na.join('; ')}. Se interpretan de forma descriptiva y como apoyo a la evaluación del desempeño del sistema o la calidad del cuerpo de agua.`);
const sig=c.cmp.filter(o=>o.p<A||o.pk<A).map(o=>PN[o.k]);
if(c.cmp.length)out.push(`<b>Comparación entre grupos (α = ${A}):</b> `+(sig.length?`se hallaron diferencias significativas en ${sig.join(', ')}.`:'no se hallaron diferencias significativas en los parámetros evaluados.'));
const sc=c.cor.filter(o=>o.p<A);if(sc.length)out.push(`<b>Correlaciones significativas:</b> ${sc.map(o=>`${PN[o.a]}–${PN[o.b]} (r = ${f(o.r)})`).join('; ')}.`);
return out}
function autoConcl(c){const sm=S.samples;if(!sm.length)return'';const ds=sm.map(s=>s.fecha).filter(Boolean).sort(),L_=[];
L_.push(`Se analizaron ${sm.length} muestras${c.groups.length>1?` en ${c.groups.length} grupos/puntos`:''}${ds.length?` entre el ${fd(ds[0])} y el ${fd(ds[ds.length-1])}`:''}.`);
const bad=sm.filter(s=>['dbo','dqo','ayg','ph','temp'].some(k=>ev(s,k)==='no'));
L_.push(bad.length?`${bad.length} de ${sm.length} muestras incumplen al menos un parámetro del ECA Categoría 3 – ${subN()}: ${bad.map(s=>`${s.codigo} (${['dbo','dqo','ayg','ph','temp'].filter(k=>ev(s,k)==='no').map(k=>PN[k]).join(', ')})`).join('; ')}.`:`Todas las muestras cumplen los parámetros evaluables del ECA Categoría 3 – ${subN()}.`);
const sig=c.cmp.filter(o=>o.p<S.alpha||o.pk<S.alpha).map(o=>PN[o.k]);L_.push(sig.length?`Existen diferencias estadísticamente significativas entre grupos en: ${sig.join(', ')}.`:(c.cmp.length?'No existen diferencias estadísticamente significativas entre grupos.':''));
L_.push('SST, SSV, turbidez y alcalinidad no cuentan con valor ECA en la Categoría 3 y se reportan como información complementaria.');return L_.filter(Boolean).map((x,i)=>`${i+1}. ${x}`).join('\n')}
/* ---------- informe ---------- */
function report(){const c=compute(),R=S.rep,sm=S.samples;
const concl=(R.concl||autoConcl(c)).split('\n').filter(x=>x.trim()).map(x=>`<p style="margin:3px 0">${esc(x)}</p>`).join('');
$('rep').innerHTML=`<h1 style="text-align:center;font-size:20px;margin:0">${esc(R.titulo)}</h1><p style="text-align:center;margin:2px 0 14px">ECA para Agua – Categoría 3, subcategoría ${subN()}</p>
${tbl(['Dato','Detalle'],[['Encargado de monitoreo',esc(R.encargado)+(R.cargo?` – ${esc(R.cargo)}`:'')],['Institución',esc(R.inst)],['Cuerpo de agua',esc(R.cuerpo)],['Ubicación',esc(R.lugar)],['Fecha del informe',fd(R.fecha)]])}
<h3>1. Marco legal</h3><ul>${R.legal.split('\n').filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<h3>2. Identificación de muestras</h3>${tbl(['Código','Grupo / punto','Día','Hora','Zona UTM','Este (m)','Norte (m)'],sm.map(s=>[esc(s.codigo),esc(s.grupo),fd(s.fecha),s.hora||'—',esc(s.zona),s.este||'—',s.norte||'—']))}
<h3>3. Reactivos utilizados (observaciones)</h3>${tbl(['Código','Reactivos / observaciones'],sm.map(s=>[esc(s.codigo),`<span style="text-align:left">${esc(s.reactivos)||'—'}</span>`]))}
<h3>4. Resultados frente al ECA</h3>${tRes()}<p style="font-size:12px">✗ = incumple el ECA. “sin ECA”: parámetro sin valor en la Categoría 3.</p>
<h3>5. Estadística descriptiva</h3>${tDesc(c)}${tGrp(c)}
<h3>6. Estadística inferencial (α = ${S.alpha})</h3><b>6.1 Media vs. límite ECA</b>${tOne(c)}<b>6.2 Comparación entre grupos</b>${tCmp(c)}<b>6.3 Correlaciones</b>${tCor(c)}
<h3>7. Interpretación</h3>${interp(c).map(x=>`<p style="margin:4px 0">${x}</p>`).join('')||'<p>Sin datos.</p>'}
<h3>8. Conclusiones</h3>${concl}
<div class="sign"><div>${esc(R.encargado)||'&nbsp;'}<br>Encargado de monitoreo<br>Firma / DNI / CIP</div><div>&nbsp;<br>Revisor / Responsable<br>Firma / Sello</div></div>`}
/* ---------- UI: formulario ---------- */
function buildForm(){$('form').innerHTML=FLD.map(([k,n,t])=>t==='sel'?`<label>${n}<select id="f_${k}"><option>17S</option><option>18S</option><option selected>19S</option></select></label>`:`<label>${n}<input id="f_${k}" type="${t}" ${t==='number'?'step="any"':''}></label>`).join('')}
const rd=()=>Object.fromEntries(FLD.map(([k])=>[k,$('f_'+k).value.trim()]));
function setForm(s){FLD.forEach(([k])=>$('f_'+k).value=s?s[k]??'':(k==='zona'?'19S':''));$('ftitle').textContent=s?'Editando muestra':'Nueva muestra'}
function list(){$('cnt').textContent=S.samples.length;$('list').innerHTML=S.samples.length?tbl(['Código','Grupo','Día','Hora',...PAR.map(p=>p[1]),''],S.samples.map(s=>[esc(s.codigo),esc(s.grupo),fd(s.fecha),s.hora||'—',...PAR.map(([k])=>`<span class="${ev(s,k)==='no'?'no':''}">${s[k]||'—'}</span>`),`<button class="b s" data-e="${s.id}">Editar</button><button class="b s" data-d="${s.id}">✕</button>`])):'<p class="mut">Aún no hay muestras.</p>'}
function stats(){const c=compute();$('stats').innerHTML=S.samples.length?`<div class="card"><h2>Estadística descriptiva</h2>${tDesc(c)}<h3>Por grupo / punto</h3>${tGrp(c)}</div><div class="card"><h2>Estadística inferencial</h2><h3>Media vs. límite ECA</h3>${tOne(c)}<h3>Comparación entre grupos</h3>${tCmp(c)}<h3>Correlaciones</h3>${tCor(c)}</div>`:'<div class="card mut">Registra muestras para ver el análisis.</div>'}
function buildCfg(){const l=L();$('cfg').innerHTML=`<label>Subcategoría<select id="c_sub"><option value="D1">D1 Riego de vegetales</option><option value="D2">D2 Bebida de animales</option></select></label><label>α (significancia)<input id="c_alpha" type="number" step="0.01" value="${S.alpha}"></label>`+[['dbo','DBO₅ máx.'],['dqo','DQO máx.'],['ayg','Aceites y grasas máx.'],['phmin','pH mín.'],['phmax','pH máx.'],['dT','Δ Temperatura máx. (°C)']].map(([k,n])=>`<label>${n}<input class="c_l" data-k="${k}" type="number" step="any" value="${l[k]}"></label>`).join('');$('c_sub').value=S.sub}
function buildRcfg(){const R=S.rep;$('rcfg').innerHTML=[['titulo','Título'],['encargado','Encargado de monitoreo'],['cargo','Cargo / CIP'],['inst','Institución'],['cuerpo','Cuerpo de agua'],['lugar','Ubicación'],['fecha','Fecha del informe','date']].map(([k,n,t])=>`<label>${n}<input class="r_i" data-k="${k}" type="${t||'text'}" value="${esc(R[k])}"></label>`).join('');$('legal').value=R.legal;$('concl').value=R.concl}
const all=()=>{list();stats();report();save()};
const csvq=v=>`"${String(v??'').replace(/"/g,'""')}"`;
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on');all()});
$('save').onclick=()=>{const s=rd();if(!s.codigo){alert('Ingresa el código de muestra.');return}if(editId){S.samples=S.samples.map(x=>x.id===editId?{...s,id:editId}:x)}else S.samples.push({...s,id:Date.now()+''+Math.random().toString(36).slice(2,5)});editId=null;setForm();all()};
$('clear').onclick=()=>{editId=null;setForm()};
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e){editId=b.dataset.e;setForm(S.samples.find(s=>s.id===editId));scrollTo(0,0)}if(b.dataset.d&&confirm('¿Eliminar muestra?')){S.samples=S.samples.filter(s=>s.id!==b.dataset.d);all()}};
$('exJ').onclick=()=>dl('muestras_eca3.json',JSON.stringify(S.samples,null,1),'application/json');
$('imJ').onclick=()=>$('file').click();
$('file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);if(Array.isArray(a)){S.samples=a.map(s=>({...s,id:s.id||Date.now()+Math.random()}));all()}}catch(x){alert('Archivo no válido')}};r.readAsText(e.target.files[0])};
$('exC').onclick=()=>dl('muestras_eca3.csv','\ufeff'+[FLD.map(x=>x[0]).join(','),...S.samples.map(s=>FLD.map(([k])=>csvq(s[k])).join(','))].join('\n'),'text/csv');
$('wipe').onclick=()=>{if(confirm('¿Borrar todas las muestras?')){S.samples=[];all()}};
$('demo').onclick=()=>{const d=[['M-01','Entrada','2026-11-03','08:15',369120,8009450,120,95,48,95,22,7.1,19.8,310,9.5],['M-02','Entrada','2026-11-03','08:40',369135,8009462,135,102,52,110,25,7.3,20.1,322,11.2],['M-03','Entrada','2026-11-10','09:05',369118,8009455,128,98,50,102,23,7.0,19.5,305,8.7],['M-04','Salida','2026-11-03','09:30',369410,8009120,28,18,9,28,6,7.8,19.2,260,2.1],['M-05','Salida','2026-11-03','09:50',369418,8009131,32,20,12,35,7,8.0,19.4,268,3.4],['M-06','Salida','2026-11-10','10:20',369405,8009125,30,19,10,31,6.5,8.9,19.0,255,6.0]];
S.samples=d.map((r,i)=>({id:'d'+i,codigo:r[0],grupo:r[1],fecha:r[2],hora:r[3],zona:'19S',este:r[4],norte:r[5],sst:r[6],ssv:r[7],dbo:r[8],dqo:r[9],turb:r[10],ph:r[11],temp:r[12],alc:r[13],ayg:r[14],tref:'18',reactivos:'Ejemplo ficticio: H₂SO₄ (conserv. DQO), K₂Cr₂O₇, hexano (A y G)'}));all()};
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='c_sub'){S.sub=t.value;buildCfg();all()}else if(t.id==='c_alpha'){S.alpha=num(t.value)||.05;all()}else if(t.classList.contains('c_l')){S.lim[S.sub][t.dataset.k]=num(t.value);all()}
else if(t.classList.contains('r_i')){S.rep[t.dataset.k]=t.value;report();save()}else if(t.id==='legal'){S.rep.legal=t.value;report();save()}else if(t.id==='concl'){S.rep.concl=t.value;report();save()}});
$('gen').onclick=()=>{S.rep.concl=autoConcl(compute());$('concl').value=S.rep.concl;report();save()};
$('prn').onclick=()=>window.print();
$('doc').onclick=()=>dl('informe_monitoreo.doc',`<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial;font-size:11pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #777;padding:3px;font-size:9pt}th{background:#eee}.no{color:#b3261e;font-weight:bold}.sign{margin-top:60px}.sign div{display:inline-block;width:45%;border-top:1px solid #000;text-align:center;margin-right:4%}</style></head><body>${$('rep').innerHTML}</body></html>`,'application/msword');
buildForm();setForm();buildCfg();buildRcfg();all();
</script>
</body>
</html>
